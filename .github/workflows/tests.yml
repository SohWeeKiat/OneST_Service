name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
 unit-test:
  runs-on: ubuntu-latest
        
  steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Build packages
      run: npm run build:packages
    
    - name: test packages
      run: npm run test:packages

    - name: Build project
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Run lint
      run: npm run lint