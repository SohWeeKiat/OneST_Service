services:
  frontend:
    build:
      context: .
      dockerfile: frontend-onest/Dockerfile
      args:
        BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:3001
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend-onest/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped